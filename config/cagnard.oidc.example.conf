# Authentication/authorization version 2 — requires the matching v2 binary.
# See docs/reference/authentication.md, authorization.md and storage-access.md.
#
# Deployment: https://files.example.test behind a TLS reverse proxy.
# Login: local accounts plus company OIDC.
# Storage: filesystem homes/shared documents and an S3 archive.
# Unspecified settings, including structuredData limits, use shipped defaults.

server {
  host = "0.0.0.0"
  port = 8080
}

appearance {
  defaultPalette = classic
  defaultMode = system
  allowUserOverride = true
}

tasks {
  maxConcurrentItems = 4
}

# 1. How people sign in.
auth {
  version = 2
  publicUrl = "https://files.example.test"

  session {
    # Inject a random protection key; keep it consistent across replicas.
    key = ${CAGNARD_SESSION_KEY}
    ttlSeconds = 3600
    secureCookies = true
  }

  providers = [
    {
      id = local
      type = static
      label = "Local account"
      enabled = true

      users = [
        {
          id = alice
          displayName = "Alice Example"
          enabled = true
          groups = [engineering]
          # Preserve an existing home at /srv/cagnard/homes/alice.
          storageKey = alice
          credential.verifier = ${CAGNARD_ALICE_PASSWORD_VERIFIER}
        },
        {
          id = recovery
          displayName = "Recovery operator"
          enabled = true
          groups = []
          # Access is granted directly in a binding below.
          credential.verifier = ${CAGNARD_RECOVERY_PASSWORD_VERIFIER}
        }
      ]
    },
    {
      id = company
      type = oidc
      label = "Company SSO"
      enabled = true
      issuer = "https://sso.example.test/realms/company"
      clientId = cagnard
      clientSecret = ${CAGNARD_OIDC_CLIENT_SECRET}
      # Prefer a mounted CA for private certificates. See docs/guides/oidc.md.
      # true skips certificate AND hostname verification for this provider only.
      trustAllCertificates = false
      scopes = [openid, profile, email]

      # Register this exact redirect URI with the identity provider:
      # https://files.example.test/api/auth/providers/company/callback
      # Configure the IdP to include a groups array in the ID token.
      # Claim paths are JSON Pointers; values match exactly.
      groupMappings = [
        { claim = "/groups", value = "/engineering", group = engineering },
        { claim = "/groups", value = "/auditors", group = auditors },
        { claim = "/groups", value = "/operations", group = operations }
      ]

      # No local user list is needed for OIDC users.
      # Their default home storage key is derived from stable identity.
      # Signing in as Alice through SSO does not automatically link to
      # the local alice account or reuse its existing home directory.
    }
  ]
}

# 2. Who belongs together, what actions exist, and where they are granted.
authorization {
  groups = [
    { id = engineering, label = Engineering },
    { id = auditors, label = Auditors },
    { id = operations, label = "Storage operators" }
  ]

  # These role names are declared here; none has built-in privileges.
  roles = [
    {
      id = reader
      actions = ["storage.list", "storage.read"]
    },
    {
      id = editor
      # Write includes approved overwrites; editor is not non-destructive.
      actions = [
        "storage.list", "storage.read", "storage.write",
        "storage.mkdir", "storage.rename"
      ]
    },
    {
      id = manager
      # No role inheritance: the complete action set is explicit.
      actions = [
        "storage.list", "storage.read", "storage.write",
        "storage.mkdir", "storage.rename", "storage.delete"
      ]
    }
  ]

  # Matching grants add together. No matching grant means no access.
  # Subjects within a binding are alternatives; each role applies to
  # each listed root for every matching subject.
  bindings = [
    {
      # Each member can manage only their own resolved home.
      subjects = [{ group = engineering }, { group = operations }]
      roles = [manager]
      roots = [{ tunnel = personal, rootId = home }]
    },
    {
      subjects = [{ group = engineering }]
      roles = [editor]
      roots = [{ tunnel = global, rootId = shared }]
    },
    {
      subjects = [{ group = auditors }]
      roles = [reader]
      roots = [{ tunnel = global, rootId = shared }]
    },
    {
      # Direct user grant alongside a group grant. No implicit superuser.
      subjects = [
        { group = operations },
        { providerId = local, subject = recovery }
      ]
      roles = [manager]
      roots = [{ tunnel = global, rootId = shared }]
    },
    {
      subjects = [
        { group = engineering },
        { group = auditors },
        { group = operations },
        { providerId = local, subject = recovery }
      ]
      roles = [reader]
      roots = [{ tunnel = global, rootId = archive }]
    },
    {
      # Deliberately readable by every successfully authenticated user,
      # including an SSO user with no mapped application group.
      subjects = [{ authenticated = true }]
      roles = [reader]
      roots = [{ tunnel = global, rootId = handbook }]
    }
  ]
}

# 3. Which storage systems Cagnard connects to.
# These are storage providers, separate from auth.providers above.
providers = [
  {
    id = filesystem
    type = filesystem
    family = unix
    displayName = "Server filesystem"
  },
  {
    id = object-store
    type = s3
    family = s3
    displayName = "Company S3"
    settings {
      region = "eu-west-3"
      sslEnabled = true
      trustAllCertificates = false
    }
  }
]

# 4. How the backend accesses those storage systems.
# Account readOnly is an upper bound on every user's role permissions.
accounts = [
  {
    id = filesystem-write
    providerId = filesystem
    displayName = "Local process"
    enabled = true
    readOnly = false
    authMode = local-process
  },
  {
    id = filesystem-read
    providerId = filesystem
    displayName = "Local process, read-only"
    enabled = true
    readOnly = true
    authMode = local-process
  },
  {
    id = archive-read
    providerId = object-store
    displayName = "Archive credentials"
    enabled = true
    readOnly = true
    authMode = default-chain
    settings {
      # Uses backend workload/environment credentials, not the user's OIDC
      # token. Give that backend identity read access to the archive prefix.
      credentialMode = default-chain
    }
  }
]

# 5. Which storage roots exist. Permissions live only in bindings above.
personalStorage = [
  {
    id = home
    label = "My files"
    providerId = filesystem
    accountId = filesystem-write
    path = "/srv/cagnard/homes/{principal.storageKey}"
  }
]

globalStorage = [
  {
    id = shared
    label = "Shared documents"
    providerId = filesystem
    accountId = filesystem-write
    path = "/srv/cagnard/shared"
  },
  {
    id = archive
    label = Archives
    providerId = object-store
    accountId = archive-read
    settings {
      bucket = "company-cagnard"
      prefix = "archives"
    }
  },
  {
    id = handbook
    label = Handbook
    providerId = filesystem
    accountId = filesystem-read
    path = "/srv/cagnard/handbook"
  }
]
