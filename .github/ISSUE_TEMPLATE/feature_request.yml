name: Feature request
description: Propose a focused improvement to Cagnard.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should Cagnard solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior without requiring a particular implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe current workarounds or rejected approaches.
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and operational impact
      description: Note relevant providers, authentication modes, deployments, migrations, or security boundaries.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I described the problem separately from the proposed implementation.
          required: true
