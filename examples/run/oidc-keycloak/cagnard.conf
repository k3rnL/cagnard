# Cagnard stateless backend configuration.
# HOCON supports comments, includes, and substitutions.

server {
  host = "127.0.0.1"
  port = 8080
}

tasks {
  maxConcurrentItems = 4
}

appearance {
  defaultPalette = classic
  defaultMode = system
  allowUserOverride = true
}

# Optional browser analytical-work limits. These are the maintained defaults;
# lower them for memory-constrained or untrusted large-file deployments.
structuredData {
  relational { maxIngestionBytes = 67108864, maxIngestionRows = 200000 }
  sql { timeoutMilliseconds = 30000, maxResultRows = 100000, maxQueryCharacters = 100000 }
  worker { maxResponseBytes = 16777216 }
  iceberg { maxMetadataBytes = 2097152, maxProbeEntries = 10000 }
  netcdf {
    maxSourceBytes = 134217728
    maxSliceCells = 100000
    maxSliceBytes = 16777216
    maxProjectionRows = 100000
    maxPlotCells = 20000
  }
  exports { maxRows = 100000, maxBytes = 16777216 }
}

# Authentication v2. See docs/reference/authentication.md and authorization.md.
# Demo credentials and key are public: replace them before exposing this server.
auth {
  version = 2
  publicUrl = "http://localhost:5173"
  allowInsecureLoopback = true
  session {
    key = "Y2FnbmFyZC10ZXN0LWtleS0zMi1ieXRlcy0wMDAwMDA="
    ttlSeconds = 3600
    secureCookies = false
  }
  providers = [{
    id = static
    type = static
    label = "Cagnard account"
    enabled = true
    users = [{
      id = alice
      displayName = "Alice Example"
      enabled = true
      storageKey = alice
      groups = [engineering]
      # Demo password: cagnard. Preserve this verifier when migrating existing users.
      credential.verifier = "pbkdf2-sha256:120000:Y2FnbmFyZC1kZW1vLXN0YXRpYy11c2VyLXNhbHQ:fUdgpOu_Z3MHhgdWzUku12tWnSH5s9BhfjJVv1fiIms"
    }]
  }, {
    id = company
    type = oidc
    label = "Keycloak SSO"
    enabled = true
    issuer = "http://localhost:8081/realms/cagnard"
    clientId = cagnard
    clientSecret = "local-oidc-secret-only"
    scopes = [openid, profile, email]
    groupMappings = [{ claim = "/groups", value = "/engineering", group = engineering }]
  }]
}

authorization {
  groups = [{ id = engineering, label = Engineering }]
  roles = [{ id = manager, actions = [storage.list, storage.read, storage.write, storage.mkdir, storage.rename, storage.delete] }]
  bindings = [{
    subjects = [{ group = engineering }]
    roles = [manager]
    roots = [{ tunnel = personal, rootId = home }, { tunnel = global, rootId = shared }]
  }]
}

providers = [
  {
    id = local
    type = filesystem
    family = unix
    displayName = "Local filesystem"
  }
]

accounts = [
  {
    id = local-admin
    providerId = local
    displayName = "Local process account"
    enabled = true
    readOnly = false
    authMode = local-process
  }
]

personalStorage = [
  {
    id = home
    label = Home
    providerId = local
    accountId = local-admin
    path = "../../storage/home/{principal.storageKey}"
  }
]

globalStorage = [
  {
    id = shared
    label = Global
    providerId = local
    accountId = local-admin
    path = "../../storage/global"
  }
]
