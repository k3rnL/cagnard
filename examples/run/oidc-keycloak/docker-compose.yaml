services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-only}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/cagnard-realm.json:ro
