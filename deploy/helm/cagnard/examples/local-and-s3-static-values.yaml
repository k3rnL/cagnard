backend:
  image:
    repository: ghcr.io/k3rnl/cagnard-backend
    tag: v0.12.0
    pullPolicy: IfNotPresent
  config:
    inline:
      enabled: true
      content: |
        server {
          host = "0.0.0.0"
          port = 8080
        }

        tasks {
          maxConcurrentItems = 4
        }

        appearance {
          defaultPalette = classic
          defaultMode = system
          allowUserOverride = true
        }

        # Authentication v2. See docs/reference/authentication.md and authorization.md.
        # Demo credentials and key are public: replace them before exposing this server.
        auth {
          version = 2
          publicUrl = "http://localhost:5173"
          allowInsecureLoopback = true
          session {
            key = "Y2FnbmFyZC10ZXN0LWtleS0zMi1ieXRlcy0wMDAwMDA="
            ttlSeconds = 3600
            secureCookies = false
          }
          providers = [{
            id = static
            type = static
            label = "Cagnard account"
            enabled = true
            users = [{
              id = alice
              displayName = "Alice Example"
              enabled = true
              storageKey = alice
              groups = [engineering]
              # Demo password: cagnard. Preserve this verifier when migrating existing users.
              credential.verifier = "pbkdf2-sha256:120000:Y2FnbmFyZC1kZW1vLXN0YXRpYy11c2VyLXNhbHQ:fUdgpOu_Z3MHhgdWzUku12tWnSH5s9BhfjJVv1fiIms"
            }]
          }]
        }

        authorization {
          groups = [{ id = engineering, label = Engineering }]
          roles = [{ id = manager, actions = [storage.list, storage.read, storage.write, storage.mkdir, storage.rename, storage.delete] }]
          bindings = [{
            subjects = [{ group = engineering }]
            roles = [manager]
            roots = [{ tunnel = personal, rootId = home }, { tunnel = personal, rootId = s3-documents }, { tunnel = global, rootId = shared }, { tunnel = global, rootId = s3-shared }]
          }]
        }

        providers = [
          {
            id = local
            type = filesystem
            family = unix
            displayName = "Local filesystem"
          },
          {
            id = s3-main
            type = s3
            family = s3
            displayName = "MinIO S3"
            settings {
              region = "us-east-1"
              endpoint = "http://minio:9000"
              pathStyleAccess = "true"
              sslEnabled = "false"
              trustAllCertificates = "false"
              requestChecksumCalculation = "when_required"
              maxBufferedObjectBytes = "67108864"
            }
          }
        ]

        accounts = [
          {
            id = local-admin
            providerId = local
            displayName = "Local process account"
            enabled = true
            readOnly = false
            authMode = local-process
          },
          {
            id = local-readonly
            providerId = local
            displayName = "Local read-only account"
            enabled = true
            readOnly = true
            authMode = local-process
          },
          {
            id = s3-main-account
            providerId = s3-main
            displayName = "MinIO demo account"
            enabled = true
            readOnly = false
            authMode = static
            settings {
              credentialMode = static
              accessKeyId = "cagnard"
              secretAccessKey = "cagnard-secret"
            }
          }
        ]

        personalStorage = [
          {
            id = home
            label = "Home"
            providerId = local
            accountId = local-admin
            path = "/data/cagnard/home/{principal.storageKey}"
          },
          {
            id = s3-documents
            label = "S3 Documents"
            providerId = s3-main
            accountId = s3-main-account
            settings {
              bucket = "cagnard-combined"
              prefix = "documents"
            }
          }
        ]

        globalStorage = [
          {
            id = shared
            label = "Global"
            providerId = local
            accountId = local-readonly
            path = "/opt/cagnard/examples/storage/global"
          },
          {
            id = s3-shared
            label = "S3 Shared"
            providerId = s3-main
            accountId = s3-main-account
            settings {
              bucket = "cagnard-combined"
              prefix = "shared"
            }
          }
        ]

  extraVolumes:
    - name: example-home
      emptyDir: {}
  extraVolumeMounts:
    - name: example-home
      mountPath: /data/cagnard/home/alice

frontend:
  image:
    repository: ghcr.io/k3rnl/cagnard-frontend
    tag: v0.12.0
    pullPolicy: IfNotPresent

ingress:
  enabled: false
