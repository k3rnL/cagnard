backend:
  image:
    repository: ghcr.io/k3rnl/cagnard-backend
    tag: v0.12.1
    pullPolicy: IfNotPresent
  config:
    inline:
      enabled: true
      content: |
        server {
          host = "0.0.0.0"
          port = 8080
        }

        tasks {
          maxConcurrentItems = 4
        }

        appearance {
          defaultPalette = solar
          defaultMode = system
          allowUserOverride = true
        }

        # Authentication v2. See docs/reference/authentication.md and authorization.md.
        # Demo credentials and key are public: replace them before exposing this server.
        auth {
          version = 2
          publicUrl = "http://localhost:5173"
          allowInsecureLoopback = true
          session {
            key = "Y2FnbmFyZC10ZXN0LWtleS0zMi1ieXRlcy0wMDAwMDA="
            ttlSeconds = 3600
            secureCookies = false
          }
          providers = [{
            id = static
            type = static
            label = "Cagnard account"
            enabled = true
            users = [{
              id = alice
              displayName = "Alice Example"
              enabled = true
              storageKey = alice
              groups = [engineering]
              # Demo password: cagnard. Preserve this verifier when migrating existing users.
              credential.verifier = "pbkdf2-sha256:120000:Y2FnbmFyZC1kZW1vLXN0YXRpYy11c2VyLXNhbHQ:fUdgpOu_Z3MHhgdWzUku12tWnSH5s9BhfjJVv1fiIms"
            }]
          }]
        }

        authorization {
          groups = [{ id = engineering, label = Engineering }]
          roles = [{ id = manager, actions = [storage.list, storage.read, storage.write, storage.mkdir, storage.rename, storage.delete] }]
          bindings = [{
            subjects = [{ group = engineering }]
            roles = [manager]
            roots = [{ tunnel = personal, rootId = s3-documents }]
          }]
        }

        providers = [
          {
            id = s3-main
            type = s3
            family = s3
            displayName = "MinIO S3"
            settings {
              region = "us-east-1"
              endpoint = "http://minio:9000"
              pathStyleAccess = "true"
              sslEnabled = "false"
              trustAllCertificates = "false"
              requestChecksumCalculation = "when_required"
              maxBufferedObjectBytes = "67108864"
            }
          }
        ]

        accounts = [
          {
            id = s3-main-account
            providerId = s3-main
            displayName = "MinIO demo account"
            enabled = true
            readOnly = false
            authMode = static
            settings {
              credentialMode = static
              accessKeyId = "cagnard"
              secretAccessKey = "cagnard-secret"
            }
          }
        ]

        personalStorage = [
          {
            id = s3-documents
            label = "S3 Documents"
            providerId = s3-main
            accountId = s3-main-account
            settings {
              bucket = "cagnard-demo"
              prefix = "documents"
            }
          }
        ]

        globalStorage = []

frontend:
  image:
    repository: ghcr.io/k3rnl/cagnard-frontend
    tag: v0.12.1
    pullPolicy: IfNotPresent

ingress:
  enabled: false
