nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/k3rnl/cagnard-backend
    tag: "v0.12.1"
    pullPolicy: IfNotPresent
  podAnnotations: {}
  env: []
  envFrom: []
  service:
    type: ClusterIP
    port: 8080
  config:
    mountPath: /etc/cagnard
    fileName: cagnard.conf
    inline:
      enabled: true
      content: |
        server {
          host = "0.0.0.0"
          port = 8080
        }

        tasks {
          maxConcurrentItems = 4
        }

        appearance {
          defaultPalette = classic
          defaultMode = system
          allowUserOverride = true
        }

        # Authentication v2. See docs/reference/authentication.md and authorization.md.
        # Required environment values must come from your deployment secret/configuration.
        auth {
          version = 2
          publicUrl = ${CAGNARD_PUBLIC_URL}
          allowInsecureLoopback = false
          session {
            key = ${CAGNARD_SESSION_KEY}
            ttlSeconds = 3600
            secureCookies = true
          }
          providers = [{
            id = static
            type = static
            label = "Cagnard account"
            enabled = true
            users = [{
              id = alice
              displayName = "Alice Example"
              enabled = true
              storageKey = alice
              groups = [engineering]
              # PBKDF2 verifier for the local recovery account.
              credential.verifier = ${CAGNARD_PASSWORD_VERIFIER}
            }]
          }]
        }

        authorization {
          groups = [{ id = engineering, label = Engineering }]
          roles = [{ id = manager, actions = [storage.list, storage.read, storage.write, storage.mkdir, storage.rename, storage.delete] }]
          bindings = [{
            subjects = [{ group = engineering }]
            roles = [manager]
            roots = [{ tunnel = personal, rootId = home }, { tunnel = global, rootId = shared }]
          }]
        }

        providers = [
          {
            id = local
            type = filesystem
            family = unix
            displayName = "Local filesystem"
          }
        ]

        accounts = [
          {
            id = local-admin
            providerId = local
            displayName = "Local"
            enabled = true
            readOnly = false
            authMode = local-process
          }
        ]

        personalStorage = [
          {
            id = home
            label = Home
            providerId = local
            accountId = local-admin
            path = "/tmp/cagnard/home/{principal.storageKey}"
          }
        ]

        globalStorage = [
          {
            id = shared
            label = Global
            providerId = local
            accountId = local-admin
            path = "/tmp/cagnard/global"
          }
        ]

    existingConfigMap:
      name: ""
      key: cagnard.conf
    existingSecret:
      name: ""
      key: cagnard.conf
    existingVolume:
      enabled: false
      volume: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraVolumes: []
  extraVolumeMounts: []

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/k3rnl/cagnard-frontend
    tag: "v0.12.1"
    pullPolicy: IfNotPresent
  podAnnotations: {}
  apiUpstream: ""
  env: []
  envFrom: []
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraVolumes: []
  extraVolumeMounts: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  routeApiToBackend: true
  hosts:
    - host: cagnard.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
